<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amharic OCR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: #1e3c72;
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 2rem;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            transition: border 0.3s;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #1e3c72;
        }

        .upload-area input {
            display: none;
        }

        .upload-label {
            cursor: pointer;
            color: #1e3c72;
            font-weight: 600;
        }

        .preview {
            margin-top: 1rem;
            max-width: 100%;
            max-height: 200px;
            display: none;
        }

        button {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: #0f2a4a;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .result {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            display: none;
        }

        .result h3 {
            color: #1e3c72;
            margin-bottom: 0.5rem;
        }

        .result pre {
            background: #e9ecef;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
            margin: 1rem 0;
        }

        .copy-btn {
            background: #28a745;
            margin-top: 0;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Amharic handwriting OCR</h1>
            <p>Upload an image containing Amharic text</p>
        </div>
        <div class="content">
            <div class="upload-area" id="uploadArea">
                <label class="upload-label" for="imageInput">Click to select image</label>
                <input type="file" id="imageInput" accept="image/*">
                <img id="preview" class="preview" alt="Preview">
            </div>
            <button id="submitBtn">Recognize Text</button>
            <div id="result" class="result">
                <h3>Detected Text:</h3>
                <pre id="textOutput"></pre>
                <button id="copyBtn" class="copy-btn">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const uploadArea = document.getElementById('uploadArea');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');
        const textOutput = document.getElementById('textOutput');
        const copyBtn = document.getElementById('copyBtn');

        // Preview image when selected
        imageInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        // Optional: click on upload area triggers file input
        uploadArea.addEventListener('click', function() {
            imageInput.click();
        });

        // Submit image to backend
        submitBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                alert('Please select an image first');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Processing...';

            try {
                // Replace with your deployed Django backend URL
                const API_URL = process.env.REACT_APP_API_URL || 'https://your-backend.vercel.app/api';
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                textOutput.innerText = data.text || 'No text detected';
                resultDiv.style.display = 'block';
            } catch (err) {
                console.error(err);
                textOutput.innerText = 'Error processing image. Please try again.';
                resultDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Recognize Text';
            }
        });

        // Copy text to clipboard
        copyBtn.addEventListener('click', () => {
            const text = textOutput.innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy');
            });
        });
    </script>
</body>
</html>
